[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trimtokens"
version = "0.2.0"
description = "Compresse ET anonymise vos documents (PDF/DOCX/PPTX/XLSX/images/HTML) en Markdown pour l'IA, 100 % en local : moins de tokens, donnees personnelles caviardees"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "RunCharles974", email = "RunCharles974@users.noreply.github.com" },
]
keywords = [
  "tokens", "markdown", "ocr", "pdf", "claude", "llm", "cleanup",
  "anonymization", "pii", "privacy", "rgpd", "redaction", "local",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Markup",
  "Topic :: Security",
  "Topic :: Utilities",
]
# Core dependencies — minimum requis pour CLI/pipeline/cleaners + formats texte
# natifs (.txt, .md). Extracteurs binaires (PDF/DOCX/etc.) en extras pour install
# légère et footprint mémoire réduit (cf audit §Packaging).
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "chardet>=5.2",
  "pyperclip>=1.8",
  "tomli>=2.0; python_version<'3.11'",
  "tiktoken>=0.7",
  "diskcache>=5.6",
]

[project.optional-dependencies]
# Extras par famille de formats. Chaque extracteur lève
# `MissingDependencyError` à l'extraction si la dep correspondante est absente.
pdf = [
  "pymupdf>=1.24",
]
office = [
  "python-docx>=1.1",
  "python-pptx>=0.6.23",
  "openpyxl>=3.1",
]
web = [
  "beautifulsoup4>=4.12",
  "markdownify>=0.12",
]
rtf = [
  "striprtf>=0.0.26",
]
ocr = [
  "pytesseract>=0.3.10",
  "Pillow>=10.0",
  "opencv-python-headless>=4.9",
  "pillow-heif>=0.16",
]
gui = [
  "customtkinter>=5.2",
  "tkinterdnd2>=0.4",
]
# Anonymisation PII. La détection regex (`anonymizer.recognizers`) ne dépend de
# rien — cet extra ajoute la NER locale (noms/sociétés/lieux). Modèle spaCy FR à
# installer séparément : `python -m spacy download fr_core_news_lg` (~500 Mo).
anonymize = [
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
  "spacy>=3.7",
  "cryptography>=42",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "pyinstaller>=6.5",
  "types-PyYAML",
]
# Méta-extras : raccourcis usuels
formats = [
  "trimtokens[pdf,office,web,rtf]",
]
# NB : `anonymize` (presidio + spaCy, lourd) volontairement EXCLU de `all` —
# il alourdit le build PyInstaller sans que la NER fonctionne dans le binaire
# (modèle spaCy ~500 Mo non embarqué). Installer séparément : trimtokens[anonymize].
all = [
  "trimtokens[pdf,office,web,rtf,ocr,gui,dev]",
]

[project.scripts]
trimtokens = "trimtokens.cli:app"

[project.gui-scripts]
trimtokens-gui = "trimtokens.gui:main"

[project.urls]
Homepage = "https://github.com/RunCharles974/trimtokens"
Repository = "https://github.com/RunCharles974/trimtokens"
Issues = "https://github.com/RunCharles974/trimtokens/issues"
Changelog = "https://github.com/RunCharles974/trimtokens/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/trimtokens"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",
  "I",
  "B",
  "UP",
  "N",
  "C4",
  "SIM",
  "RUF",
]
ignore = [
  "E501",
  "RUF001",  # Caractères unicode ambigus dans strings (projet francophone)
  "RUF002",  # Idem dans docstrings (×, —, etc.)
  "RUF003",  # Idem dans commentaires
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N803"]
"src/trimtokens/cli.py" = ["B008"]  # typer.Option/Argument calls in defaults are idiomatic

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = [
  "fitz",
  "pytesseract",
  "cv2",
  "tkinterdnd2",
  "customtkinter",
  "markdownify",
  "striprtf.*",
  "pillow_heif",
  "diskcache",
  "presidio_analyzer.*",
  "presidio_anonymizer.*",
  "spacy",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
